    <!--
      Uwaga bezpieczeństwo: HSTS, X-Frame-Options, Permissions-Policy i CSP z

      Lovable serwuje stronę po HTTPS z HSTS na poziomie platformy; przy
      własnym serwerze/CDN dodać nagłówek `Content-Security-Policy`.

    -->

    <!-- Preload hero MUSI zostac tutaj, nad arkuszami stylow: skrypt polozony
         nizej (ten przy #app-shell w <body>) czeka na pobranie CSS-a, bo arkusz
         blokuje wykonanie kolejnych skryptow. Bez tego zadanie o obrazek rusza
         dopiero w ~1250 ms zamiast w ~230 ms (zmierzone, N-03).
         Warunek na sciezce zostawia podstrony bez pobierania hero i bez
         ostrzezenia "preloaded but not used". -->
    <script>
      if (location.pathname === "/") {
        var heroPreload = document.createElement("link");
        heroPreload.rel = "preload";
        heroPreload.as = "image";
        // Zestaw kandydatow MUSI byc identyczny z #as-hero-img i z HeroSection.tsx.
        // Gdy shell zadal samego 640w, React montowal <img> z INNYM plikiem
        // (przy DPR >= 1,5 sizes=100vw wybiera 1280w) — to bylo drugie pobranie
        // hero i nowy kandydat LCP, ktory czekal na start JS (load delay 5,2 s
        // w Lighthouse simulate). Pilnuje tego hero-shell.test.ts.
        heroPreload.href = "/images/hero-parent-child-1280.webp";
        heroPreload.setAttribute("imagesrcset", "/images/hero-parent-child-640.webp 640w, /images/hero-parent-child-1280.webp 1280w, /images/hero-parent-child-1920.webp 1920w");
        heroPreload.setAttribute("imagesizes", "100vw");
        heroPreload.setAttribute("fetchpriority", "high");
        document.head.appendChild(heroPreload);
      }
    </script>


    <!-- Fonty hostowane u NAS (N-03). Powod: PSI liczylo arkusz
         fonts.googleapis.com jako 750 ms blokady renderu mimo media="print"
         + onload — na wolnym laczu arkusz zdazal przelaczyc sie na "all"
         PRZED pierwszym malowaniem, wiec sztuczka nie dzialala. Tutaj nie ma
         juz ani arkusza, ani obcego origin: @font-face siedzi w HTML-u,
         a pliki .woff2 leza w public/fonts.

         Pliki to kopia 1:1 tych z fonts.gstatic.com (DM Sans v17, DM Serif
         Display v17, subsety latin + latin-ext). Polskie znaki sa rozrzucone
         po OBU subsetach (ó siedzi w latin, ą/ę/ł/ś/ż w latin-ext), wiec
         zaden nie jest opcjonalny.

         DM Sans jest fontem ZMIENNYM (os wght 100–1000) — jeden plik obsluguje
         wagi 400/500/600/700. Zakres "400 700" celowo obcina go tak, jak robil
         to arkusz Google, ktory deklarowal wylacznie te cztery wagi.
         DM Serif Display jest statyczny (400).

         Swiadomie BEZ <link rel="preload">: font-display:swap i tak nie blokuje
         renderu, a preload konkurowalby o pasmo z hero, ktore jest elementem LCP.

         Aktualizacja kroju: pobrac css2 z UA Chrome
         (https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap),
         podmienic 4 pliki i unicode-range ponizej. -->
    <style>
      /* DM Sans — latin-ext */
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/fonts/dm-sans-latin-ext.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* DM Sans — latin */
      @font-face {
        font-family: "DM Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url(/fonts/dm-sans-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* DM Serif Display — latin-ext */
      @font-face {
        font-family: "DM Serif Display";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/dm-serif-display-latin-ext.woff2) format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* DM Serif Display — latin */
      @font-face {
        font-family: "DM Serif Display";
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url(/fonts/dm-serif-display-latin.woff2) format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191,
          U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>

    <!-- Inline krytyczny CSS: tło i hero z shellu widoczne od pierwszej klatki
         (bez zewnętrznych plików, więc render startuje po pobraniu samego shella).
         Świadomie BEZ klas Tailwinda: index.html nie jest w `content` w
         tailwind.config.ts, więc takie klasy zostałyby wycięte przy buildzie. -->
    <style>
      html, body { margin: 0; background: #FCFAF8; color: #2f3a33; }
      @keyframes al-slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
      /* --- Shell LCP (#app-shell): statyczna kopia hero, malowana ZANIM ruszy React.
             Wymiary 1:1 z HeroSection.tsx (zmierzone: naglowek 73/89 px, hero 290 px
             na telefonie, 50vh od 768px). Ten box MUSI byc >= hero Reacta — inaczej
             React domalowuje wiekszy obrazek i LCP wraca do czasu startu JS.
             Zmieniasz HeroSection? Popraw tu i w tescie hero-shell.test.ts. --- */
      #app-shell { font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif; }
      #app-shell .as-header {
        height: 73px; box-sizing: border-box; border-bottom: 1px solid #ece7e1;
        display: flex; align-items: center; padding: 0 24px;
      }
      #app-shell .as-logo { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: #497a5c; }
      #app-shell .as-hero {
        position: relative; display: flex; align-items: center; overflow: hidden;
        height: 290px; max-height: calc(60svh - var(--header-h, 72px) - var(--bottom-nav-h, 64px) - 16px);
        background: #8B7355;
      }
      #app-shell .as-hero > img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: center 30%;
      }
      #app-shell .as-veil {
        position: absolute; inset: 0;
        background: linear-gradient(to bottom, rgba(252,250,248,0.6), rgba(252,250,248,0.3) 50%, rgba(252,250,248,0.8));
      }
      #app-shell .as-copy { position: relative; z-index: 1; box-sizing: border-box; width: 100%; max-width: 576px; padding: 0 20px; }
      #app-shell .as-h1 {
        margin: 0; font-family: "DM Serif Display", Georgia, serif; font-weight: 400;
        font-size: 26px; line-height: 36px; color: #2a2622;
      }
      #app-shell .as-sub { margin: 12px 0 0; font-size: 16px; line-height: 24px; color: #595959; }
      /* Linia licznika ma tylko rezerwowac wysokosc — tresc zna dopiero React. */
      #app-shell .as-count { margin: 6px 0 0; font-size: 14px; line-height: 20px; visibility: hidden; }
      #app-shell .as-cta {
        display: flex; align-items: center; justify-content: center; margin-top: 20px;
        height: 56px; border-radius: 24px; background: #49795d; color: #fcfaf8;
        font-size: 18px; line-height: 28px; font-weight: 500;
      }
      #app-shell .as-bar { width: 180px; height: 4px; margin: 24px auto 0; border-radius: 999px; background: #e7e1da; overflow: hidden; }
      #app-shell .as-bar > i { display: block; width: 40%; height: 100%; border-radius: 999px; background: #497a5c; animation: al-slide 1.1s ease-in-out infinite; }
      @media (min-width: 768px) {
        #app-shell .as-header { height: 89px; }
        #app-shell .as-hero-outer { max-width: 1280px; margin: 0 auto; padding: 16px 16px 0; }
        #app-shell .as-hero { height: 50vh; max-height: 55vh; border-radius: 24px; }
        #app-shell .as-veil {
          background: linear-gradient(to right, rgba(252,250,248,0.6), rgba(252,250,248,0.15) 50%, rgba(252,250,248,0));
        }
        #app-shell .as-copy { max-width: 45%; padding: 0 32px; }
        #app-shell .as-cta { display: inline-flex; padding: 0 40px; }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-shell .as-bar > i { animation: none; width: 100%; }
      }
      #app-noscript { max-width: 32rem; margin: 0 auto; padding: 24px; font-family: system-ui, sans-serif; text-align: center; }
      #app-noscript a { color: #497a5c; }
    </style>
  </head>
