<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!--
      Uwaga bezpieczeństwo: HSTS, X-Frame-Options, Permissions-Policy i CSP z
      `frame-ancestors` MUSZĄ być nagłówkami HTTP — meta CSP-Report-Only jest
      ignorowane przez przeglądarki (generowało tylko błędy w konsoli).
      Lovable serwuje stronę po HTTPS z HSTS na poziomie platformy; przy
      własnym serwerze/CDN dodać nagłówek `Content-Security-Policy`.
    -->
    <title>FamilyFun – Sprawdzone atrakcje dla rodzin z dziećmi</title>
    <meta name="author" content="FamilyFun" />
    <!--
      Brak statycznego <meta name="description"> celowo: każda strona dostarcza
      DOKŁADNIE JEDEN unikalny opis przez SEOHead (react-helmet-async). Statyczny
      tag był pierwszy w DOM i crawlery brały właśnie jego, kasując unikalne opisy.
    -->

    <!--
      Brak statycznych tagów og:* / twitter:* celowo: każda strona dostarcza
      DOKŁADNIE JEDEN zestaw przez SEOHead (react-helmet-async). Statyczne tagi
      były pierwsze w DOM i parsery social brały je zamiast unikalnych per-strona.
    -->
    <!--
      Wyjątek: og:image / twitter:image są statyczne, bo parsery social nie
      wykonują JS. To sitewide baner marki (1200x640) — zastępuje automatyczny
      zrzut ekranu podglądu. Podstrony nadpisują go przez SEOHead (dedupe po
      property/name).
    -->
    <meta property="og:image" content="https://familyfun.pl/og-image-1200x630.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="FamilyFun – sprawdzone atrakcje dla rodzin z dziećmi" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://familyfun.pl/og-image-1200x630.jpg" />

    <!-- Fonts: preconnect + stylesheet w <head> zamiast @import w CSS (szybszy FCP) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Obrazy atrakcji: własna domena CDN (Cloudflare R2) -->
    <link rel="preconnect" href="https://img.familyfun.pl" crossorigin />
    <link rel="dns-prefetch" href="https://img.familyfun.pl" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap"
    />

    <!-- Preload hero jest wstrzykiwany dynamicznie tylko na stronie głównej (src/pages/Index.tsx),
         żeby uniknąć warninga "preloaded but not used" na podstronach. -->

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#497a5c" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Analytics: Plausible -->
    <script defer data-domain="familyfun.pl" src="https://plausible.io/js/script.js"></script>

    <!-- Analytics: GA4 (odkomentuj i uzupełnij ID żeby przełączyć)
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
